<span class="material-symbols-outlined text-secondary text-[20px]">mail</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface focus:outline-none placeholder:text-outline" id="email-field" placeholder="name@company.com" required="" type="email" value="alex.morgan@vanguard.io"/>
</div>
</div>
<!-- Password Floating Field Container with Visibility Toggle -->
<div class="relative flex flex-col justify-center min-h-[58px] bg-surface-container-low rounded-lg px-space-md pt-3 pb-1 transition-all focus-within:bg-surface-container focus-within:shadow-sm">
<label class="font-label-md text-label-md text-secondary font-semibold transition-all" for="password-field">
          Password
        </label>
<div class="flex items-center gap-space-sm mt-0.5">
<span class="material-symbols-outlined text-secondary text-[20px]">lock</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface focus:outline-none tracking-widest text-[16px]" id="password-field" required="" type="password" value="EnterpriseKey#902"/>
<button aria-label="Toggle password visibility" class="flex items-center justify-center p-1 rounded-full text-secondary hover:text-primary transition-colors focus:outline-none" id="toggle-password-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Action Row: Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-space-xs">
<label class="flex items-center gap-space-sm cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-primary accent-primary cursor-pointer" id="remember-me" type="checkbox"/>

</button>
<!-- Divider / Or Section -->

<div class="flex-1 h-[1px] bg-surface-container"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">or verify with</span>
<div class="flex-1 h-[1px] bg-surface-container"></div>

<button class="w-full h-11 rounded-lg bg-surface-container text-on-surface font-label-md text-label-md flex items-center justify-center gap-space-sm hover:bg-surface-container-high transition-colors active:scale-[0.98]" id="biometric-btn" type="button">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">fingerprint</span>

<img class="w-7 h-7 rounded-full object-cover shadow-sm" data-alt="Portrait of a female technical incident coordinator smiling in a modern office setup with glass partitions and soft warm bokeh background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCpnV5t-uu553iZ2jt6yA4AI-C4v43ju7ykvJBqmXq5XYgakLaJjTJf959eDbarwurpuPfmwvr69MlqV_AU9QUWy0CkHUQY5IQnlYX8es6uLzKv5GCvpYRV3-08UV9E0ZLonX2Z4XdgRJMgCbNQyU4-JPxEwQIyx3IEcdJOX3gKgxS0McIiG-YKeQVn-joLEGSEDSfZdm7eu4xsd3mOBIiM_gSWSkzJQfkDQMQF70M"/>
<div class="w-7 h-7 rounded-full bg-primary-fixed text-on-primary-fixed flex items-center justify-center font-label-sm text-label-sm font-bold shadow-sm">
          +4

</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface font-semibold">Triage Ops Live</span>
<span class="font-body-sm text-body-sm text-secondary">Average SLA pick up &lt; 2m</span>
</div>
</div>
<span class="material-symbols-outlined text-primary text-[18px]">verified</span>
</div>
<!-- Sign Up Footnote -->

      Don't have an account?

        Sign Up
      </a>
</p>
</div>
<!-- Telemetry & System Connectivity Badge -->
<div class="mt-space-xl flex flex-col items-center text-center">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container text-secondary font-label-sm text-label-sm">
<span class="w-2 h-2 rounded-full bg-primary animate-ping"></span>
<span>Connected to Odoo Core v16.4 Enterprise • SSL 256-bit</span>
</div>
</div>
</div>
<script>
  // Password Visibility Toggle Interaction
  const passwordInput = document.getElementById('password-field');
  const toggleBtn = document.getElementById('toggle-password-btn');
  const eyeIcon = document.getElementById('eye-icon');

  if (toggleBtn && passwordInput && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      if (isPassword) {
        passwordInput.classList.remove('tracking-widest');
      } else {
        passwordInput.classList.add('tracking-widest');
      }
    });
  }

  // Biometric Delight Haptic Simulation
  const biometricBtn = document.getElementById('biometric-btn');
  if (biometricBtn) {
    biometricBtn.addEventListener('click', () => {
      const origText = biometricBtn.innerHTML;
      biometricBtn.innerHTML = `
        <span class="material-symbols-outlined text-primary animate-spin text-[20px]">sync</span>
        <span class="text-primary font-semibold">Authenticating Biometrics...</span>
      `;
      setTimeout(() => {
        biometricBtn.innerHTML = `
          <span class="material-symbols-outlined text-primary text-[20px]">check_circle</span>
          <span class="text-primary font-semibold">Identity Confirmed</span>
        `;
        setTimeout(() => {
          biometricBtn.innerHTML = origText;
        }, 1800);
      }, 900);
    });
  }

  // Form Submission Micro-Interaction
  function triggerAuth() {
    const signInBtn = document.getElementById('sign-in-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');

    if (!signInBtn || !btnText || !btnIcon) return;

    btnText.textContent = 'Verifying Session...';
    btnIcon.textContent = 'hourglass_top';
    btnIcon.classList.add('animate-spin');
    signInBtn.classList.add('opacity-90');

    setTimeout(() => {
      btnText.textContent = 'Success! Redirecting...';
      btnIcon.textContent = 'check';
      btnIcon.classList.remove('animate-spin');
      signInBtn.classList.replace('bg-primary', 'bg-tertiary');
    }, 1200);
  }
</script></main></body></html>
