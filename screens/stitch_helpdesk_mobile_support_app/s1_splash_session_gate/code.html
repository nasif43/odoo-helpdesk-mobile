  </head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col antialiased"><main class="flex-1 flex flex-col relative w-full bg-surface pt-safe pb-safe"><div class="flex flex-col w-full px-gutter py-space-lg items-center justify-between min-h-[795px]">

<script>
  (function initSessionGate() {
    const statusEl = document.getElementById('session-status');
    const barEl = document.getElementById('session-bar');
    const bypassBtn = document.getElementById('auth-bypass-btn');

    const steps = [
      { text: "Verifying secure session token...", width: "25%" },
      { text: "Resolving tenant endpoint...", width: "55%" },
      { text: "Syncing SLA matrices & tickets...", width: "85%" },
      { text: "Session valid. Launching Desk...", width: "100%" }
    ];

    let currentStep = 0;

    const interval = setInterval(() => {
      currentStep++;
      if (currentStep < steps.length) {
        if (statusEl) statusEl.textContent = steps[currentStep].text;
        if (barEl) barEl.style.width = steps[currentStep].width;
      } else {
        clearInterval(interval);
      }
    }, 1100);

    if (bypassBtn) {
      bypassBtn.addEventListener('click', () => {
        clearInterval(interval);
        if (barEl) barEl.style.width = "100%";
        if (statusEl) statusEl.textContent = "Biometric matched. Opening queue...";
        bypassBtn.classList.add('opacity-50', 'pointer-events-none');
      });
    }
  })();
